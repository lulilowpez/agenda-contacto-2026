<header>
  <div>
    <a class="button" routerLink="/contacts">⬅</a>
    <h1>{{contacto?.name}}</h1>
  </div>
  <button>Cerrar sesión</button>
</header>
<main>
<h1>Detalles del Contacto</h1>
 <div>
    <p>Telefono</p> 
    <p>{{contacto?.phone}}</p>
  </div>
  <div>
    <p>Email</p>
    <p>{{contacto?.email}}</p>
  </div>
  <div>
    <p>Dirección</p>
    <p>{{contacto?.direction}}</p>
  </div>
  @if(contacto){
    <div>
      <button>Editar</button>
      <button (click)="eliminarContacto(contacto.id)">Eliminar</button>
    </div>
  }
</main>
