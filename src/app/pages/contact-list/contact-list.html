<header>
  <button>Cerrar sesión</button>
</header>
<main>
    <div>
    <h1>Mis Contactos</h1>
    <section class="Search">
        <input type="text" placeholder="Buscar Contacto" name="search">
        <button>Buscar</button>
    </section>
    <section class="ContactList">
         @for (contact of contactsService.contactList; track $index) {    
            <div>
                <a [routerLink]="['/contacts', contact.id]">

                <span>{{contact.imageUrl}}</span>
                <span>{{contact.name}}</span>
                <span>{{contact.surname}}</span>
                <span>{{contact.phone}}</span>
                <span>{{contact.email}}</span>
            </a>
            <div>
                <a class="button" [routerLink]="['/contacts',contact.id,'edit']">Editar</a>
                 <button (click)="eliminarContacto(contact.id)">Eliminar</button>

            </div>
            </div>
        }
    
    </section>

    </div>

    <a class="fab" routerLink="/contacts/create">+</a>
 </main>
