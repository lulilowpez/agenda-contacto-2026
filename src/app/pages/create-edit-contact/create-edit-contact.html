<header>
  <h1>Mis contactos</h1>
  <button (click)="authService.logout()">Cerrar sesión</button>
</header>
<main>
    <form submit="onSubmit($event)">
        <h2>Crear Contacto</h2>
        <label for="name">Introduzca nombre</label>
        <input type="text" id="name" [formField]="formCreateContact.name" >
        <label for="surname">Introduzca apellido</label>
        <input  id="surname" [formField]="formCreateContact.surname" type="text" >
        <label for="phone">Introduzca telefono</label>
        <input  [formField]="formCreateContact.phone" type="text"  id="phone">
        <label for="email">Introduzca email</label>
        <input  id="email" [formField]="formCreateContact.email" type="text" >
        <label for="address">Introduzca direccion</label>
        <input  id="address" [formField]="formCreateContact.address" type="text">
        <button>{{id() ? 'Editar contacto' : 'Agregar contacto'}}</button>
    </form>
</main>
