<form (submit)="register($event)">
  <h2>Registrese en Agenda de Contacto 2026</h2>
  <label for="img">Subir imagen</label>
  <input id="" type="file" name="img" [formField]="formRegister.image" />

  <label for="nombre">Introduzca nombre</label>
  <input [formField]="formRegister.name" id="" [formField]type="text" name="nombre" />

  <label for="apellido">Introduzca apellido</label>
  <input [formField]="formRegister.surname" id="" type="text" name="apellido" />

  <label for="phone">Introduzca teléfono</label>
  <input [formField]="formRegister.phone" id="" type="text" name="phone" />

  <label for="email">Introduzca email</label>
  <input [formField]="formRegister.email" id="" type="email" name="email" />
  <label for="contrasenia">Introduzca contraseña</label>

  <input [formField]="formRegister.password" id="" type="password" name="pass" />
  <label for="confirmar contrasenia">Confirme contraseña</label>

  <input [formField]="formRegister.confirmPassword" id="" type="password" />
  @if (formRegister.confirmPassword().invalid()) {
    <p>Las contraseñaes no coinciden</p>
  }

  <button [disabled]="formRegister().invalid()">Registrarse</button>
  <p>¿Ya tenés cuenta? <a routerLink="/login">Iniciar sesión</a></p>
</form>
